<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00854A"><title>Kiểm thử Core — Classic Skin</title>
<style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}#testStatus{position:fixed;z-index:9999;right:12px;top:12px;background:#fff;border:1px solid #b8d6c7;border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:0 2px 12px #0002}#testError{display:none;white-space:pre-wrap;background:#fff0f0;color:#8b1111;margin:12px;padding:12px;border:1px solid #e99;border-radius:8px}#classicRoot{min-height:100vh}</style></head><body>
<div id="testStatus">Đang tải Classic Skin…</div><div id="testError"></div><main id="classicRoot"></main>
<script src="./core/skin-manager.js"></script><script src="./skins/classic/skin.js"></script>
<script>
(async()=>{const status=document.getElementById("testStatus"),err=document.getElementById("testError");try{const manager=PTICoreSkinManager.createSkinManager({root:document.getElementById("classicRoot"),context:{assetBase:new URL("./skins/classic/",location.href).href}});manager.register("classic",PTICoreClassicSkin);await manager.use("classic");status.textContent="Classic Skin đã mount";status.style.color="#087443";window.__classicSkinManager=manager;}catch(e){status.textContent="Lỗi khởi tạo";err.style.display="block";err.textContent=String(e&&e.stack||e);console.error(e);}})();
</script></body></html>
