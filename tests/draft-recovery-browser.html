<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Draft Recovery Browser Test Fixture</title></head>
<body>
  <select id="gdv"><option value="GĐV kiểm thử">GĐV kiểm thử</option></select>
  <input id="bks"><input id="hoso"><input id="garage"><input id="date"><input id="title">
  <div id="counts"><button class="opt">1</button><button class="opt">2</button><button class="opt">4</button><button class="opt">6</button></div>
  <div id="orient"><button class="opt" data-o="portrait">Portrait</button><button class="opt" data-o="landscape">Landscape</button></div>
  <div id="driveId" class="hidden"></div>
  <div id="status"></div>
  <script src="../core/local-draft-store.js"></script>
  <script src="../core/draft-recovery.js"></script>
  <script>
  (function(){
    const state={groups:[],current:{title:'Bản ảnh chi tiết thiệt hại',items:[]},editing:-1,pages:[],pageDefs:[],driveRecordId:'',localDraftId:'',driveOpenIncomplete:false,orientation:'portrait',per:6,addSeq:0};
    const $=id=>document.getElementById(id);
    const store=window.PTILocalDraftStore.install({dbName:'pti093_local_drafts_v1'});
    const api=window.PTI093DraftRecovery.install({
      state,$,
      getDateISO:()=>$('date').value,
      setDateInput:value=>{$('date').value=value||'';},
      render:()=>{document.body.dataset.rendered='yes';},
      renderLayout:()=>{document.body.dataset.layoutRendered='yes';},
      setDriveState:text=>{document.body.dataset.driveState=text;},
      msg:text=>{$('status').textContent=text;},
      ...store
    });
    window.testHarness={
      state,api,store,
      seed:async()=>{
        $('gdv').value='GĐV kiểm thử';$('bks').value='30A-12345';$('hoso').value='HS-TEST-01';$('garage').value='Garage thử';$('date').value='2026-10-23';$('title').value='Nhóm hiện trường';
        state.orientation='landscape';state.per=4;state.addSeq=2;
        state.groups=[{title:'Nhóm trước',items:[{file:new File([new Uint8Array([255,216,255,217])],'front.jpg',{type:'image/jpeg',lastModified:1234}),key:'front.jpg|4|1234',caption:'Ảnh trước xe',rotate:90,addSeq:1}]}];
        state.current={title:'Nhóm hiện trường',items:[{file:new File([new Uint8Array([1,2,3,4,5])],'rear.jpg',{type:'image/jpeg',lastModified:5678}),key:'rear.jpg|5|5678',caption:'Ảnh sau xe',rotate:180,addSeq:2}]};
        await api.saveAutoDraft();
        return sessionStorage.getItem('pti093_work_session_id');
      },
      restore:async()=>{
        await api.restoreAutoDraft();
        const itemA=state.groups[0].items[0],itemB=state.current.items[0];
        return {
          sessionId:sessionStorage.getItem('pti093_work_session_id'),
          bks:$('bks').value,hoso:$('hoso').value,garage:$('garage').value,date:$('date').value,gdv:$('gdv').value,
          orientation:state.orientation,per:state.per,
          groups:state.groups.map(g=>({title:g.title,items:g.items.map(i=>({name:i.file.name,type:i.file.type,size:i.file.size,lastModified:i.file.lastModified,caption:i.caption,rotate:i.rotate,addSeq:i.addSeq}))})),
          current:{title:state.current.title,items:state.current.items.map(i=>({name:i.file.name,type:i.file.type,size:i.file.size,lastModified:i.file.lastModified,caption:i.caption,rotate:i.rotate,addSeq:i.addSeq}))},
          frontBytes:Array.from(new Uint8Array(await itemA.file.arrayBuffer())),
          rearBytes:Array.from(new Uint8Array(await itemB.file.arrayBuffer()))
        };
      },
      seedIncompleteDriveDraft:async()=>{
        $('bks').value='30A-PARTIAL';$('hoso').value='HS-PARTIAL';$('garage').value='Garage partial';$('date').value='2026-10-23';$('title').value='Partial Drive record';
        state.driveRecordId='DRIVE-INCOMPLETE';state.localDraftId='';state.driveOpenIncomplete=true;
        state.current={title:'Partial Drive record',items:[{file:new File([new Uint8Array([1,2,3])],'partial.jpg',{type:'image/jpeg',lastModified:4321}),key:'partial.jpg|3|4321',caption:'Partial',rotate:0,addSeq:1}]};
        state.groups=[];state.addSeq=1;
        await api.saveAutoDraft();
      },
      restoreIncompleteDriveDraft:async()=>{
        state.driveRecordId='';state.localDraftId='';state.driveOpenIncomplete=false;
        await api.restoreAutoDraft();
        return {driveRecordId:state.driveRecordId,driveOpenIncomplete:state.driveOpenIncomplete,caseNumber:$('hoso').value};
      },
      restoreNewSession:async()=>{
        await api.restoreAutoDraft();
        return {
          sessionId:sessionStorage.getItem('pti093_work_session_id'),
          bks:$('bks').value,hoso:$('hoso').value,garage:$('garage').value,
          groups:state.groups.length,currentItems:state.current.items.length,
          driveRecordId:state.driveRecordId||''
        };
      },
      seedOrphanImages:async()=>{
        const db=await store.openLocalDraftDB();
        try{
          await new Promise((resolve,reject)=>{
            const tx=db.transaction('draftImages','readwrite');
            tx.objectStore('draftImages').put({
              id:'AUTO-DRAFT|orphan|0',draftId:'AUTO-DRAFT',sectionIndex:0,itemIndex:0,
              file:new File([new Uint8Array([9,8,7])],'orphan.jpg',{type:'image/jpeg'}),
              fileName:'orphan.jpg',type:'image/jpeg',lastModified:123
            });
            tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
          });
        }finally{db.close();}
      },
      countDraftRows:async()=>{
        const db=await store.openLocalDraftDB();
        try{
          return await new Promise((resolve,reject)=>{
            const tx=db.transaction(['drafts','draftImages'],'readonly');
            const a=tx.objectStore('drafts').count();
            const b=tx.objectStore('draftImages').count();
            tx.oncomplete=()=>resolve({drafts:a.result,images:b.result});
            tx.onerror=()=>reject(tx.error);
          });
        }finally{db.close();}
      },
      cleanupFailureRecovery:async()=>{
        const originalOpen=window.indexedDB.open;
        let rejected=false;
        try{
          window.indexedDB.open=function(){throw new Error('Simulated IndexedDB open failure');};
          try{await api.clearAutoDraft()}catch(e){rejected=true}
        }finally{
          window.indexedDB.open=originalOpen;
        }
        await api.saveAutoDraft();
        const drafts=await store.getLocalDrafts();
        return {rejected,autosaveRecovered:drafts.some(d=>d.id==='AUTO-DRAFT')};
      },
      cleanup:async()=>{
        await api.clearAutoDraft();
        const db=await store.openLocalDraftDB();
        try{
          const counts=await new Promise((resolve,reject)=>{
            const tx=db.transaction(['drafts','draftImages'],'readonly');
            const a=tx.objectStore('drafts').count();
            const b=tx.objectStore('draftImages').count();
            tx.oncomplete=()=>resolve({drafts:a.result,images:b.result});
            tx.onerror=()=>reject(tx.error);
          });
          return counts;
        }finally{db.close();}
      }
    };
  })();
  </script>
</body>
</html>
