<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic Skin Calendar Browser Test</title></head>
<body>
<div id="skinRoot"></div>
<script src="/core/date-utils.js"></script>
<script src="/skins/classic/skin.js"></script>
<script>
(async function(){
  try {
    await window.PTICoreClassicSkin.mount({root:document.getElementById('skinRoot')});
    const $=id=>document.getElementById(id);
    const dateUtils=window.PTI093DateUtils.install({$});
    window.__calendarInstance=window.PTI093DateCalendarSkin.install({$,document,dateUtils});
    window.__skinReady=true;
  } catch(error) {
    window.__skinError=String(error&&error.stack||error);
  }
})();
</script>
</body>
</html>
