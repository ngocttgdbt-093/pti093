<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Classic Image Grid Skin Test</title>
<style>#grid .thumb{display:block;margin:4px;border:1px solid;padding:4px}#grid img{width:30px;height:20px}</style></head><body>
<div id="grid"></div><div id="groupsBox"></div>
<button id="clear"></button><button id="saveNext"></button><button id="finish"></button>
<input id="replaceFile" type="file"><input id="insertFile" type="file">
<script src="../core/image-reorder.js"></script><script src="../skin/classic-group-list.js"></script><script src="../skin/classic-image-grid.js"></script>
<script>
window.gridState={current:{items:[
 {file:new File([new Uint8Array([1,2,3])],'a.jpg',{type:'image/jpeg'}),caption:'Caption A',rotate:90},
 {file:new File([new Uint8Array([4,5,6])],'b.jpg',{type:'image/jpeg'}),caption:'Caption B',rotate:0}
]},groups:[]};
window.gridCalls=[];window.gridSaves=[];let gridSkin;
const $=id=>document.getElementById(id);
const groupSkin=window.PTI093ClassicGroupListSkin.install({state:window.gridState,$,document,onEditGroup:i=>gridCalls.push(['editGroup',i])});
const reorder=window.PTI093ImageReorder.install({state:window.gridState,$,scheduleAutoDraftSave:v=>gridSaves.push(v),renderLayout:()=>{},render:()=>gridSkin.render()});
gridSkin=window.PTI093ClassicImageGridSkin.install({
 state:window.gridState,$,document,URL,imageReorder:reorder,openImageViewer:(item,i)=>gridCalls.push(['view',i]),
 renderGroups:()=>groupSkin.renderGroups(),
 onReplace:i=>gridCalls.push(['replace',i]),
 onRotate:(item,i)=>{item.rotate=(item.rotate+90)%360;gridCalls.push(['rotate',i]);gridSkin.render();gridSaves.push(true);},
 onInsert:i=>gridCalls.push(['insert',i]),
 onDelete:i=>{gridCalls.push(['delete',i]);gridState.current.items.splice(i,1);gridSkin.render();gridSaves.push(true);},
 onCaptionChange:(item,value)=>{item.caption=value;gridSaves.push(false);}
});
window.gridSkin=gridSkin;window.gridSkin.render();
</script></body></html>
