name: Project 5 Core — Classic Acceptance

on:
  push:
    branches:
      - build/project5-core-classic-acceptance-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classic-core-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Syntax-check Core and Classic modules
        run: |
          node --check core/app-core.js
          node --check core/project5-core-preview.js
          node --check core/caption-tools.js
          node --check core/date-utils.js
          node --check core/group-workflow.js
          node --check core/image-canvas.js
          node --check core/image-editing.js
          node --check core/image-ingest.js
          node --check core/image-reorder.js
          node --check core/local-draft-store.js
          node --check core/draft-recovery.js
          node --check core/local-save.js
          node --check core/local-open.js
          node --check core/pdf-builder.js
          node --check core/pdf-export.js
          node --check core/pdf-export-controller.js
          node --check skin/classic-image-grid.js
          node --check skins/classic/date-calendar.js
      - name: Enforce Classic-only and module exclusion boundaries
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('core/app-core.js', 'utf8');
          const preview = fs.readFileSync('core/project5-core-preview.js', 'utf8');
          const forbidden = [
            'skin-modern.css', 'ui-mode-toggle.js', 'modern-image-gallery.js',
            'uiModeToggle', 'driveBox', 'driveCreate', 'driveSaveProject',
            'driveSaveDraft', 'fusion/drive.js', 'drive-recovery-guard.js',
            'pti-gdv-admin', 'admin-gdv'
          ];
          const found = forbidden.filter(term => html.includes(term));
          if (found.length) throw new Error('Forbidden UI/module reference(s) in Core preview: ' + found.join(', '));
          if (!html.includes('./skins/classic/date-calendar.css') || !html.includes('./skins/classic/date-calendar.js')) throw new Error('Classic date calendar package is not mounted');
          if (!html.includes('./core/drive-loader.js')) throw new Error('Core Preview Drive guard loader missing');
          if (!preview.includes("new URLSearchParams(root.location.search).get('corePreview') === '1'")) throw new Error('Core Preview flag missing');
          if (!preview.includes("setItem('pti093_ui_mode', 'classic')")) throw new Error('Preview is not locked to Classic');
          if (!app.includes('CORE_PREVIEW_MODE ? null : window.PTI093HostAssembly.installDrive(')) throw new Error('Drive adapter is not guarded from Core Preview');
          console.log('PASS: Classic-only UI; Drive, Modern and PTI GĐV administration are not loaded.');
          NODE
      - name: Start local test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/project5-http.log 2>&1 &
          echo $! >/tmp/project5-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/project5-http.log
          exit 1
      - name: Run Core unit and regression tests 10 consecutive rounds
        run: |
          for round in $(seq 1 10); do
            echo "Core regression round $round/10"
            node core/caption-tools.test.cjs
            node tests/group-workflow.test.js
            node tests/workspace-core.test.js
            node tests/workspace-lock-inputs.test.js
            node tests/workspace-mutation-revision.test.js
            node tests/date-utils.test.js
            node tests/device-context.test.js
            node tests/file-delivery.test.js
            node tests/file-naming.test.js
            node tests/image-canvas.test.js
            node tests/image-editing.test.js
            node tests/image-ingest.test.js
            node tests/local-draft-store-storage-blocked.test.js
            node tests/local-open.test.js
            node tests/local-save.test.js
            node tests/local-save-open-group-edit.test.js
            node tests/draft-recovery.test.js
            node tests/draft-recovery-flush.test.js
            node tests/draft-recovery-group-edit.test.js
            node tests/draft-recovery-incomplete.test.js
            node tests/draft-recovery-open-race.test.js
            node tests/draft-recovery-race.test.js
            node tests/draft-recovery-restore-open-race.test.js
            node tests/draft-recovery-storage-blocked.test.js
            node tests/pdf-builder.test.js
            node tests/pdf-export.test.js
            node tests/pdf-export-controller.test.js
            node tests/preview-builder.test.js
            node tests/session-actions.test.js
            node tests/case-editor.test.js
          done
      - name: Run Classic skin, selection, calendar and browser acceptance tests
        run: |
          node tests/classic-file-intake-skin.test.cjs
          node tests/classic-group-list-skin.test.cjs
          node tests/classic-image-grid-skin.test.cjs
          node tests/classic-image-viewer-skin.test.cjs
          node tests/classic-layout-skin.test.cjs
          node tests/classic-load-progress-skin.test.cjs
          node tests/classic-local-save-skin.test.cjs
          node tests/classic-pdf-warning-skin.test.cjs
          node tests/classic-preview-skin.test.js
          node tests/classic-status-skin.test.cjs
          node tests/classic-skin-calendar-browser.test.cjs
          node tests/project5-caption-tools-browser.test.cjs
          node tests/project5-core-preview-browser.test.cjs
          node tests/draft-recovery-browser.test.cjs
          node tests/image-reorder-browser.test.cjs
      - name: Verify immutable runnable preview assets
        run: |
          base="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          curl -fsSL "${base}/index.html?corePreview=1" -o /tmp/core-classic-preview.html
          curl -fsSL "${base}/core/project5-core-preview.js" -o /tmp/core-classic-mode.js
          curl -fsSL "${base}/skin/classic-image-grid.js" -o /tmp/core-classic-grid.js
          curl -fsSL "${base}/skins/classic/date-calendar.js" -o /tmp/core-classic-calendar.js
          curl -fsSL "${base}/skins/classic/date-calendar.css" -o /tmp/core-classic-calendar.css
          grep -q 'Project 5 – Core Preview (Classic Skin)' /tmp/core-classic-preview.html
          grep -q "pti093_ui_mode', 'classic'" /tmp/core-classic-mode.js
          grep -q 'selected.clear();lastIndex=-1' /tmp/core-classic-grid.js
          grep -q 'PTI093DateCalendarSkin' /tmp/core-classic-calendar.js
          grep -q '.dateCalendar' /tmp/core-classic-calendar.css
          echo "PASS: immutable Classic acceptance preview assets are reachable."
