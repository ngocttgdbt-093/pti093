          const appCore = fs.readFileSync('core/app-core.js', 'utf8');
          const core = fs.readFileSync('core/draft-recovery.js', 'utf8');
          const store = fs.readFileSync('core/local-draft-store.js', 'utf8');
          const required = ['AUTO-DRAFT', 'function scheduleAutoDraftSave', 'async function saveAutoDraft', 'async function restoreAutoDraft', 'async function finalizeCompletedSession'];
