name: Validate PTI093 JavaScript

on:
  push:
    branches: [main, refactor/core-modules-test-20261022]
  pull_request:
    branches: [main, refactor/core-modules-test-20261022]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check each embedded JavaScript block
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('Không tìm thấy <script> trong index.html');
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const [, attrs, source] = match;
            if (/\bsrc\s*=/i.test(attrs) || !source.trim()) continue;
            if (/^\s*async\s*$/m.test(source)) {
              throw new Error('Có token async đứng riêng trong script số ' + (index + 1));
            }
            new Function(source);
            checked++;
          }
          if (!checked) throw new Error('Không có script nội bộ nào được kiểm tra');
          console.log('PTI093 JavaScript syntax: OK (' + checked + ' inline scripts)');
          NODE

      - name: Check 093 draft-recovery source contract
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const appCore = fs.readFileSync('core/app-core.js', 'utf8');
          const core = fs.readFileSync('core/draft-recovery.js', 'utf8');
          const store = fs.readFileSync('core/local-draft-store.js', 'utf8');
          const required = ['AUTO-DRAFT', 'function scheduleAutoDraftSave', 'async function saveAutoDraft', 'async function restoreAutoDraft', 'async function finalizeCompletedSession'];
          const missing = required.filter(x => !core.includes(x));
          if (missing.length) throw new Error('Thiếu thành phần hợp đồng lưu nháp trong Core: ' + missing.join(', '));
          if (!html.includes('src="./core/draft-recovery.js"')) throw new Error('index.html chưa nạp core/draft-recovery.js');
          if (!html.includes('src="./core/local-draft-store.js"')) throw new Error('index.html chưa nạp core/local-draft-store.js');
          if (!appCore.includes("dbName:'pti093_local_drafts_v1'")) throw new Error('Tên kho lưu nháp 093 đã bị thay đổi');
          if (!store.includes('function openLocalDraftDB') || !store.includes('function localDraftTransactionDone') || !store.includes('function getLocalDrafts')) throw new Error('Thiếu API kho lưu nháp dùng chung');
          console.log('093 draft-recovery source contract: OK');
          NODE

      - name: Test shared GĐV search Core module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: node tests/gdv-search.test.js

      - name: Check shared Core local draft store
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: node --check core/local-draft-store.js
      - name: Test shared Core local draft store and recovery
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: node tests/draft-recovery.test.js

      - name: Cache Playwright Chromium
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
      - name: Install Playwright Chromium
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test draft recovery in real Chromium with IndexedDB
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: |
          python3 -m http.server 4173 >/tmp/pti093-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/draft-recovery-browser.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/draft-recovery-browser.test.cjs
          node tests/image-reorder-browser.test.cjs
          node tests/app-smoke-browser.test.cjs
          node tests/classic-local-save-skin.test.cjs
          node tests/classic-load-progress-skin.test.cjs
          node tests/classic-image-viewer-skin.test.cjs
          node tests/classic-status-skin.test.cjs
          node tests/classic-layout-skin.test.cjs
          node tests/classic-group-list-skin.test.cjs
          node tests/classic-image-grid-skin.test.cjs
          node tests/classic-pdf-warning-skin.test.cjs
          node tests/classic-file-intake-skin.test.cjs
          node tests/gdv-093-fusion.test.cjs

      - name: Check Image Ingest Core module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: node --check core/image-ingest.js
      - name: Test Image Ingest Core module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
