name: Validate GHÉP ẢNH 093 Core

on:
  push:
    branches: [main, refactor/core-modules-test-20261022, refactor/core-modules-review-20261023, test/core-093-20261023, feat/project5-module-packaging-20261028, refactor/project5-host-assembly-slice-20261029]
  pull_request:
    branches: [main, refactor/core-modules-test-20261022, refactor/core-modules-review-20261023, test/core-093-20261023, integration/project5-caption-core-20261027, feat/project5-module-packaging-20261028]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Project 5 caption core and integration modules
        run: |
          node --check core/caption-tools.js
          node --check core/host-093-assembly.js
          node --check core/app-core.js
          node tests/host-093-assembly.test.cjs
          node --check core/image-canvas.js
          node --check skin/classic-image-grid.js
          node --check skin/classic-layout.js
      - name: Test Project 5 caption core helpers
        run: node core/caption-tools.test.cjs
      - name: Check Project 5 caption stylesheet reference
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('./css/project5-caption-tools.css')) throw new Error('Missing Project 5 CSS link');
          if (!html.includes('./core/caption-tools.js')) throw new Error('Missing caption core script');
          if (html.indexOf('./core/caption-tools.js') > html.indexOf('./core/app-core.js')) throw new Error('Caption module must load before app-core');
          console.log('Project 5 local asset order: OK');
          NODE
      - name: Check each embedded JavaScript block
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('Không tìm thấy <script> trong index.html');
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const [, attrs, source] = match;
            if (/\bsrc\s*=/i.test(attrs) || !source.trim()) continue;
            if (/^\s*async\s*$/m.test(source)) {
              throw new Error('Có token async đứng riêng trong script số ' + (index + 1));
            }
            new Function(source);
            checked++;
          }
          if (!checked) {
            console.log('No inline JavaScript remains; external modules are checked in dedicated steps');
          } else {
            console.log('PTI093 JavaScript syntax: OK (' + checked + ' inline scripts)');
          }
          NODE

      - name: Audit local asset references and zero-inline-script boundary
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.ref_name == 'refactor/core-modules-review-20261023' || github.ref_name == 'test/core-093-20261023' || github.head_ref == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-review-20261023' || github.head_ref == 'test/core-093-20261023' || github.head_ref == 'integration/project5-caption-core-20261027' || github.ref_name == 'feat/project5-module-packaging-20261028' || github.head_ref == 'feat/project5-module-packaging-20261028'
