name: Validate PTI093 JavaScript

on:
  push:
    branches: [main, refactor/core-modules-test-20261022]
  pull_request:
    branches: [main, refactor/core-modules-test-20261022]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check each embedded JavaScript block
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('Không tìm thấy <script> trong index.html');
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const [, attrs, source] = match;
            if (/\bsrc\s*=/i.test(attrs) || !source.trim()) continue;
            if (/^\s*async\s*$/m.test(source)) {
              throw new Error('Có token async đứng riêng trong script số ' + (index + 1));
            }
            new Function(source);
            checked++;
          }
          if (!checked) throw new Error('Không có script nội bộ nào được kiểm tra');
          console.log('PTI093 JavaScript syntax: OK (' + checked + ' inline scripts)');
          NODE

      - name: Check 093 draft-recovery source contract
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = ['pti093_local_drafts_v1', 'AUTO-DRAFT', 'function scheduleAutoDraftSave', 'async function saveAutoDraft', 'async function restoreAutoDraft', 'async function finalizeCompletedSession'];
          const missing = required.filter(x => !html.includes(x));
          if (missing.length) throw new Error('Thiếu thành phần hợp đồng lưu nháp: ' + missing.join(', '));
          console.log('093 draft-recovery source contract: OK');
          NODE

      - name: Test shared GĐV search Core module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: node tests/gdv-search.test.js

      - name: Check extracted Drive Fusion module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: node --check fusion/drive.js
      - name: Test extracted Drive Fusion module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.head_ref == 'refactor/core-modules-test-20261022'
        run: node tests/drive-fusion.test.js
