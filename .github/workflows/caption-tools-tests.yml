name: Caption Tools Core Tests

on:
  push:
    branches:
      - test-caption-bulk-autocorrect-20261027
    paths:
      - "modules/caption-tools-093/**"
      - "index.html"
      - ".github/workflows/caption-tools-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "modules/caption-tools-093/**"
      - "index.html"
      - ".github/workflows/caption-tools-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run caption module tests
        run: node modules/caption-tools-093/caption-tools-core.test.cjs
      - name: Run caption UI integration-contract smoke tests
        run: node modules/caption-tools-093/caption-tools-ui-smoke.test.cjs
