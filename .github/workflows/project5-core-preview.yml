name: Validate Project 5 Core Preview

on:
  push:
    branches:
      - build/project5-core-preview-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check core and skin modules
        run: |
          node --check core/app-core.js
          node --check core/host-093-assembly.js
          node --check core/caption-tools.js
          node --check core/image-canvas.js
          node --check skin/classic-image-grid.js
          node --check skin/classic-layout.js
      - name: Run existing core tests
        run: |
          node core/caption-tools.test.cjs
          node tests/host-093-assembly.test.cjs
          node tests/local-references.test.js
      - name: Assert Core Preview excludes Drive installation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('core/app-core.js', 'utf8');
          const css = fs.readFileSync('css/project5-core-preview.css', 'utf8');
          if (!html.includes('./css/project5-core-preview.css') || !css.includes('.project5-core-preview .driveBox')) throw new Error('Core Preview UI guard missing');
          if (!app.includes("CORE_PREVIEW_MODE ? null : window.PTI093HostAssembly.installDrive(")) throw new Error('Drive adapter is not excluded in Core Preview mode');
          const mode = fs.readFileSync('core/project5-core-preview.js', 'utf8');
          if (!mode.includes("new URLSearchParams(root.location.search).get('corePreview') === '1'")) throw new Error('Core Preview mode flag missing');
          console.log('Core Preview Drive exclusion: PASS');
          NODE
